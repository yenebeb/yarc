name: release

# Every merge to main is released. The version comes from git tags, not package.json:
#   the next patch (v0.1.2 -> v0.1.3) by default;
#   PR label `release:minor` / `release:major` for a bigger bump, `release:skip` (or
#   "[skip release]" in the commit message) for none;
#   none either when the merge only changes what isn't in the app: workflows, docs, tests, Markdown
#   at the top level. It ships with the next release that changes the app.
# The tag is created on the squashed commit, the three platforms build into a draft release,
# and the release is published once all of them succeed. A failed build leaves the draft.
# Run it manually from the Actions tab to release main with a chosen bump.
# Pull requests run it too, as a dry run: the same three builds, tests and packaging, without a
# tag, a draft, signing secrets or an upload, so a change that would break the release fails on
# the PR instead of after the merge.
#
# The jobs that run dependency code (install, test, build, package) get a read-only token and never
# the Ed25519 update key: a later step of the same job could be handed code by an earlier one
# ($GITHUB_ENV, BASH_ENV, rewritten scripts). The key is used in its own job (sign) that installs
# nothing, and only the upload job can write to the release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# One release at a time, in merge order: each run reads the tag the previous one created.
# A pull request's dry run only replaces its own previous run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the draft release
      pull-requests: read # labels of the merged PR
    outputs:
      version: ${{ steps.next.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      # Keeps its credentials to push the tag; this job runs no dependency code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags
      - id: next
        name: Pick the next version, tag and create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "Dry run for a pull request: no tag, no draft."
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main only."
            exit 1
          fi
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "This commit is already released ($(git tag --points-at HEAD | tr '\n' ' '))."
            exit 0
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            bump="$INPUT_BUMP"
          else
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[0].labels[]?.name] | join(",")' || true)
            case ",$labels," in
              *,release:skip,*) bump=skip ;;
              *,release:major,*) bump=major ;;
              *,release:minor,*) bump=minor ;;
              *) bump=patch ;;
            esac
            case "$MESSAGE" in *"[skip release]"*) bump=skip ;; esac
            # A squashed merge has one parent. Every changed path outside the app: nothing to release.
            if [ "$bump" != skip ] && ! git diff --name-only HEAD^ HEAD | grep -qvE '^(\.github/|\.claude/|docs/|test/|[^/]+\.md$)'; then
              echo "Only workflows, docs or tests changed."
              bump=skip
            fi
          fi
          if [ "$bump" = "skip" ]; then
            echo "Not releasing this commit."
            exit 0
          fi

          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major=${major#v}
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          echo "${latest:-none} -> v$version ($bump)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "YARC v$version"
          git push origin "v$version"
          gh release create "v$version" --draft --verify-tag --title "YARC v$version" --generate-notes \
            --notes "Downloads: Windows \`YARC-Setup-*-x64.exe\` (or \`-arm64.exe\`), macOS \`YARC-*-arm64.dmg\` (Apple silicon) or \`-x64.dmg\` (Intel), Linux \`.AppImage\`. Not code-signed: on Windows click More info > Run anyway; on macOS open it once, then System Settings > Privacy & Security > Open Anyway."
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # What's New in the app: each PR's "What's New" lines (or its title, for older PRs) per release
      # tag, including the one just made, so an update that skips versions still lists them all. One
      # JSON line, written into each build below and uploaded with the release for the update card.
      - id: changelog
        name: Build the What's New changelog
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/changelog.mjs build/changelog.json
          {
            echo "changelog<<CHANGELOG_EOF"
            node -e 'process.stdout.write(JSON.stringify(JSON.parse(require("fs").readFileSync("build/changelog.json", "utf8"))))'
            echo
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest # Apple silicon runner; builds both arm64 and x64 DMGs
            platform: --mac
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's dry run builds the PR itself.
          ref: ${{ github.event_name != 'pull_request' && format('v{0}', needs.version.outputs.version) || '' }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1, pnpm version from package.json "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The app's version (About, installers, auto-update metadata) is the tag's.
      - run: npm pkg set version="$VERSION"
      # Baked into the app by electron.vite.config.ts (What's New).
      - name: Write the changelog
        env:
          CHANGELOG: ${{ needs.version.outputs.changelog }}
        run: if [ -n "$CHANGELOG" ]; then printf '%s' "$CHANGELOG" > build/changelog.json; fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # One self-signed certificate for every release, so macOS keeps camera and microphone
      # permissions across updates (scripts/mac-sign.mjs, docs/electron-notes.md section 9).
      # Not for a pull request: its code mustn't run with the signing secrets. It signs ad-hoc.
      - name: Import the macOS code-signing certificate
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          MAC_CODESIGN_P12: ${{ secrets.MAC_CODESIGN_P12 }}
          MAC_CODESIGN_P12_PASSWORD: ${{ secrets.MAC_CODESIGN_P12_PASSWORD }}
        run: |
          if [ -z "$MAC_CODESIGN_P12" ]; then
            echo "::warning::The MAC_CODESIGN_P12 secret is missing: signing ad-hoc, so macOS asks for camera and microphone again after this update."
            exit 0
          fi
          scripts/import-mac-certificate.sh
      - name: Package
        run: pnpm exec electron-builder ${{ matrix.platform }} --publish never
        env:
          # No Apple certificate: never pick one up from the keychain; electron-builder.yml
          # sets identity "-" (ad-hoc), which is used regardless of this flag.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Installed copies read it to tell an update with a new Electron (Chromium security fixes,
      # worth a sooner restart prompt) from a normal one: src/main/update-escalation.ts.
      - name: Write release.json
        if: runner.os == 'Linux'
        # A block scalar: on one line, YAML reads the ": " inside the script as a mapping and
        # rejects the whole workflow, so no job runs at all.
        run: |
          node -e 'require("fs").writeFileSync("release/release.json", JSON.stringify({ electron: require("electron/package.json").version }) + "\n")'
      # Installed copies list what a downloaded update brings from it (src/main/changelog.ts).
      - name: Add the changelog to the release
        if: runner.os == 'Linux'
        run: if [ -f build/changelog.json ]; then cp build/changelog.json release/changelog.json; fi
      # What mac-update.ts checks before installing, plus: signed with the certificate if there is one.
      # Not for a pull request: without the secrets it signs ad-hoc, which --strict rejects
      # ("code has no resources but signature indicates they must be present").
      - name: Check the macOS code signatures
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          shopt -s nullglob
          apps=(release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::No .app in release/mac*/"
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict "$app"
            requirement=$(codesign -d -r- "$app" 2>&1 | grep designated)
            echo "$app: $requirement"
            if [ -n "${MAC_CODESIGN_IDENTITY:-}" ] && [[ "$requirement" != *"certificate leaf"* ]]; then
              echo "::error::$app isn't signed with the certificate"
              exit 1
            fi
          done
      # Handed to the sign and upload jobs; a pull request's dry run only lists them.
      - name: Collect the release files
        env:
          EVENT: ${{ github.event_name }}
        run: |
          shopt -s nullglob
          # Only patterns: nullglob drops one that matches nothing, but keeps a plain path even when
          # the file isn't there (release.json and changelog.json are only written on Linux).
          files=(release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.blockmap release/latest*.yml release/release*.json release/changelog*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers in release/"
            exit 1
          fi
          mkdir -p dist
          cp "${files[@]}" dist/
          if [ "$EVENT" = "pull_request" ]; then
            printf 'Dry run, would upload:\n'
            printf '  %s\n' "${files[@]}"
          fi
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ runner.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  # Signs what installed copies check before they update (src/main/update-signature.ts): the macOS
  # update zips (mac-update.ts) and the Windows installers (updater.ts). No dependencies, no
  # build: the repository's own script and Node's crypto. In the release-signing environment, so
  # the key can live there (Settings > Environments, deployment branch main) instead of in a
  # repository secret that every job can read.
  sign:
    needs: [version, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Sign the macOS update zips and the Windows installers
        env:
          MAC_UPDATE_SIGNING_KEY: ${{ secrets.MAC_UPDATE_SIGNING_KEY }}
        run: |
          shopt -s nullglob
          files=(dist/*-mac.zip dist/YARC-Setup-*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Nothing to sign in dist/"
            exit 1
          fi
          node --experimental-strip-types scripts/sign-update.mts "${files[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: dist/*.sig
          if-no-files-found: error
          retention-days: 3

  # The only job that can write to the release, and it runs nothing but gh.
  upload:
    needs: [version, build, sign]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "v$VERSION" dist/* --clobber

  publish:
    needs: [version, upload]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "v${{ needs.version.outputs.version }}" --draft=false --latest
