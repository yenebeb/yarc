name: release

# Every merge to main is released. The version comes from git tags, not package.json:
#   the next patch (v0.1.2 -> v0.1.3) by default;
#   PR label `release:minor` / `release:major` for a bigger bump, `release:skip` (or
#   "[skip release]" in the commit message) for none.
# The tag is created on the merge commit, the three platforms build into a draft release,
# and the release is published once all of them succeed. A failed build leaves the draft.
# Run it manually from the Actions tab to release main with a chosen bump.
# Pull requests run it too, as a dry run: the same three builds, tests and packaging, without a
# tag, a draft, signing secrets or an upload, so a change that would break the release fails on
# the PR instead of after the merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # tags and releases
  pull-requests: read # labels of the merged PR

# One release at a time, in merge order: each run reads the tag the previous one created.
# A pull request's dry run only replaces its own previous run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags
      - id: next
        name: Pick the next version, tag and create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "Dry run for a pull request: no tag, no draft."
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main only."
            exit 1
          fi
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "This commit is already released ($(git tag --points-at HEAD | tr '\n' ' '))."
            exit 0
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            bump="$INPUT_BUMP"
          else
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[0].labels[]?.name] | join(",")' || true)
            case ",$labels," in
              *,release:skip,*) bump=skip ;;
              *,release:major,*) bump=major ;;
              *,release:minor,*) bump=minor ;;
              *) bump=patch ;;
            esac
            case "$MESSAGE" in *"[skip release]"*) bump=skip ;; esac
          fi
          if [ "$bump" = "skip" ]; then
            echo "Not releasing this commit."
            exit 0
          fi

          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major=${major#v}
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          echo "${latest:-none} -> v$version ($bump)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "YARC v$version"
          git push origin "v$version"
          gh release create "v$version" --draft --verify-tag --title "YARC v$version" --generate-notes \
            --notes "Downloads: Windows \`YARC-Setup-*-x64.exe\` (or \`-arm64.exe\`), macOS \`YARC-*-arm64.dmg\` (Apple silicon) or \`-x64.dmg\` (Intel), Linux \`.AppImage\`. Not code-signed: on Windows click More info > Run anyway; on macOS open it once, then System Settings > Privacy & Security > Open Anyway."
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # What's New in the app: PR titles per release tag, including the one just made, so an update
      # that skips versions still lists them all. One JSON line, written into each build below.
      - id: changelog
        name: Build the What's New changelog
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/changelog.mjs build/changelog.json
          {
            echo "changelog<<CHANGELOG_EOF"
            node -e 'process.stdout.write(JSON.stringify(JSON.parse(require("fs").readFileSync("build/changelog.json", "utf8"))))'
            echo
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest # Apple silicon runner; builds both arm64 and x64 DMGs
            platform: --mac
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request's dry run builds the PR itself.
          ref: ${{ github.event_name != 'pull_request' && format('v{0}', needs.version.outputs.version) || '' }}
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The app's version (About, installers, auto-update metadata) is the tag's.
      - run: npm pkg set version="$VERSION"
      # Baked into the app by electron.vite.config.ts (What's New).
      - name: Write the changelog
        env:
          CHANGELOG: ${{ needs.version.outputs.changelog }}
        run: if [ -n "$CHANGELOG" ]; then printf '%s' "$CHANGELOG" > build/changelog.json; fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # One self-signed certificate for every release, so macOS keeps camera and microphone
      # permissions across updates (scripts/mac-sign.mjs, docs/electron-notes.md section 9).
      # Not for a pull request: its code mustn't run with the signing secrets. It signs ad-hoc.
      - name: Import the macOS code-signing certificate
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          MAC_CODESIGN_P12: ${{ secrets.MAC_CODESIGN_P12 }}
          MAC_CODESIGN_P12_PASSWORD: ${{ secrets.MAC_CODESIGN_P12_PASSWORD }}
        run: |
          if [ -z "$MAC_CODESIGN_P12" ]; then
            echo "::warning::The MAC_CODESIGN_P12 secret is missing: signing ad-hoc, so macOS asks for camera and microphone again after this update."
            exit 0
          fi
          scripts/import-mac-certificate.sh
      - name: Package
        run: pnpm exec electron-builder ${{ matrix.platform }} --publish never
        env:
          # No Apple certificate: never pick one up from the keychain; electron-builder.yml
          # sets identity "-" (ad-hoc), which is used regardless of this flag.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Installed copies read it to tell an update with a new Electron (Chromium security fixes,
      # worth a sooner restart prompt) from a normal one: src/main/update-escalation.ts.
      - name: Write release.json
        if: runner.os == 'Linux'
        # A block scalar: on one line, YAML reads the ": " inside the script as a mapping and
        # rejects the whole workflow, so no job runs at all.
        run: |
          node -e 'require("fs").writeFileSync("release/release.json", JSON.stringify({ electron: require("electron/package.json").version }) + "\n")'
      # What mac-update.ts checks before installing, plus: signed with the certificate if there is one.
      - name: Check the macOS code signatures
        if: runner.os == 'macOS'
        run: |
          shopt -s nullglob
          apps=(release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::No .app in release/mac*/"
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict "$app"
            requirement=$(codesign -d -r- "$app" 2>&1 | grep designated)
            echo "$app: $requirement"
            if [ -n "${MAC_CODESIGN_IDENTITY:-}" ] && [[ "$requirement" != *"certificate leaf"* ]]; then
              echo "::error::$app isn't signed with the certificate"
              exit 1
            fi
          done
      # Installed Macs only install an update zip whose Ed25519 signature matches the public key
      # in src/main/update-signature.ts (see scripts/sign-update.mts for making the key pair).
      - name: Sign the macOS update zips
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          MAC_UPDATE_SIGNING_KEY: ${{ secrets.MAC_UPDATE_SIGNING_KEY }}
        run: node --experimental-strip-types scripts/sign-update.mts release/*-mac.zip
      - name: Upload to the draft release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.zip release/*.zip.sig release/*.AppImage release/*.blockmap release/latest*.yml release/release.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers in release/"
            exit 1
          fi
          gh release upload "v$VERSION" "${files[@]}" --clobber

  publish:
    needs: [version, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "v${{ needs.version.outputs.version }}" --draft=false --latest
