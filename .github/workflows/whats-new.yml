name: whats-new

# Every PR says what YARC users see of it: a "## What's New" section in its description, with a
# short line per thing they'll notice or "none" (.github/pull_request_template.md, scripts/whats-new.mjs). The release
# builds the app's What's New and the update card from it; the title stays on GitHub.
# Its own workflow, so editing the description re-runs only this check, not the build and tests.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: whats-new-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  whats-new:
    # Dependabot's bumps never reach What's New (scripts/changelog.mjs).
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Check the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/whats-new.mjs --check
