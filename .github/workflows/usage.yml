name: usage

# Installs download one tiny file per platform and count from the `usage` pre-release (src/main/usage.ts).
# This records the download totals each day in its counts.csv and shows the counts on the release page.
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usage

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Create the usage release and its files if missing
        run: |
          gh release view usage > /dev/null 2>&1 ||
            gh release create usage --prerelease --latest=false --target main --title "Usage counts" --notes "Counts appear after the first daily run."
          have=$(gh release view usage --json assets --jq '.assets[].name')
          mkdir -p "$RUNNER_TEMP/usage"
          for file in $(node --input-type=module -e "const { usageFiles } = await import('./src/main/usage.ts'); console.log(usageFiles().join('\n'))"); do
            if ! grep -qx "$file" <<< "$have"; then
              printf 1 > "$RUNNER_TEMP/usage/$file"
              gh release upload usage "$RUNNER_TEMP/usage/$file"
            fi
          done
      - name: Record today's totals
        run: |
          cd "$RUNNER_TEMP"
          gh release download usage --pattern counts.csv --clobber || true
          gh api "repos/$GH_REPO/releases/tags/usage" --jq '[.assets[] | {name, download_count}]' > assets.json
          node "$GITHUB_WORKSPACE/scripts/usage.mjs" counts.csv assets.json > summary.md
          gh release upload usage counts.csv --clobber
          gh release edit usage --notes-file summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
