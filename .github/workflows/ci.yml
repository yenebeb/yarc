name: ci

on:
  push:
    branches: ['**']
    tags-ignore: ['v*'] # tags are handled by release.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub only reads a workflow file when it runs, so a mistake in release.yml used to show up
      # after the merge, as a release that never started. actionlint reads every workflow here.
      # Pinned and checked against the release's published checksum.
      - name: Lint the workflow files
        env:
          ACTIONLINT: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT/actionlint_${ACTIONLINT}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1, pnpm version from package.json "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # --ignore-scripts: the Electron binary (postinstall) is not needed to typecheck, test or build.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The real app on each platform, away from a desktop someone is using. Linux runs on X11 (Xvfb), not Wayland.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1, pnpm version from package.json "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 lets only AppArmor-profiled apps make user namespaces, which Chromium's sandbox needs.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" pnpm test:e2e
      - if: runner.os != 'Linux'
        run: pnpm test:e2e
      # The app crashes on macOS CI now and then and never locally: macOS's report says where.
      - if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-crash-reports
          path: ~/Library/Logs/DiagnosticReports/Electron*
          if-no-files-found: ignore
          retention-days: 14
