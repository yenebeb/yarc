name: dependabot-automerge

# Dependabot's patch and minor bumps merge as soon as the required CI (`check` and `e2e`) passes. Electron's get the
# `release:now` label and their release starts right away, not with the daily one: they carry Chromium
# and V8 security fixes. Like every release it then waits for a maintainer's approval (release.yml),
# so merging unattended is not publishing unattended. The others get the `release:skip` label and no release of their own, so users
# aren't asked to update for a dev dependency; they ship with the next release of a real change.
# Majors wait for a person: a major can break the app at runtime in ways the e2e tests don't cover.
# Supply-chain risk is limited by Dependabot's cooldown (.github/dependabot.yml): a new version of
# any package, electron included, is only proposed after it has been out for a day.
on: pull_request

permissions: {}

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # merge
      pull-requests: write # enable auto-merge, label
      actions: write # start release.yml
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge once CI passes, then release Electron bumps
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.meta.outputs.update-type)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          case ",$(printf '%s' "$NAMES" | tr -d ' ')," in
            *,electron,*) electron=true ;;
            *) electron=false ;;
          esac
          # For release.yml if someone merges it by hand, or when its run below is replaced by a newer one.
          if [ "$electron" = true ]; then label=release:now; else label=release:skip; fi
          gh api -X POST "repos/$GH_REPO/issues/$PR/labels" -f "labels[]=$label" > /dev/null
          # Squash: main takes only linear history and signed commits, and GitHub signs a squash.
          gh pr merge "$PR" --auto --squash
          if [ "$electron" = false ]; then
            echo "Not an Electron bump: it ships with the next release."
            exit 0
          fi
          # GitHub starts no workflows for a push made with this token, so the merge doesn't
          # trigger release.yml: wait for it, then start the release by hand (dispatch is allowed).
          for _ in $(seq 100); do
            case "$(gh pr view "$PR" --json state --jq .state)" in
              MERGED) exec gh workflow run release.yml --ref main ;;
              CLOSED) echo "PR $PR was closed without merging."; exit 0 ;;
            esac
            sleep 30
          done
          echo "::error::PR $PR wasn't merged within 50 minutes. Merge it, then run the release workflow from the Actions tab."
          exit 1
